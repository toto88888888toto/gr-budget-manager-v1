<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — GR Budget Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --placeholder: #9ca3af;
      --input-bg: #f9fafb;
      --btn-bg: #111827;
      --btn-hover: #1f2937;
      --accent: #111827;
      --danger: #ef4444;
      --font: 'Poppins', -apple-system, sans-serif;
    }

    body.dark {
      --bg: #0f0f0f;
      --surface: #0f0f0f;
      --border: #262626;
      --text: #f9fafb;
      --muted: #9ca3af;
      --placeholder: #4b5563;
      --input-bg: #1a1a1a;
      --btn-bg: #f9fafb;
      --btn-hover: #e5e7eb;
      --accent: #f9fafb;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      transition: background .2s, color .2s;
    }

    .wrap {
      width: 100%;
      max-width: 360px;
    }

    /* Logo */
    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo-icon img {
      width: 100%; height: 100%; object-fit: contain;
    }

    .logo-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    /* Header */
    .heading {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .subheading {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Fields */
    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      height: 42px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 14px;
      font-size: 14px;
      font-family: var(--font);
      color: var(--text);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: var(--text);
      box-shadow: 0 0 0 3px rgba(17,24,39,0.08);
    }

    body.dark input:focus {
      box-shadow: 0 0 0 3px rgba(249,250,251,0.1);
    }

    input::placeholder { color: var(--placeholder); }

    /* Button */
    .btn-submit {
      width: 100%;
      height: 42px;
      background: var(--btn-bg);
      color: body.dark ? var(--text) : #ffffff;
      border: none;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background .15s, opacity .15s;
      color: #ffffff;
    }

    body.dark .btn-submit {
      color: #111827;
    }

    .btn-submit:hover { opacity: 0.88; }
    .btn-submit:active { opacity: 0.75; }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }

    /* Error */
    #err {
      font-size: 12px;
      color: var(--danger);
      text-align: center;
      margin-top: 10px;
      min-height: 18px;
      font-weight: 500;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 20px;
    }

    /* Dark toggle */
    .theme-btn {
      position: fixed;
      top: 16px; right: 16px;
      width: 36px; height: 36px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--muted);
      transition: all .15s;
    }

    .theme-btn:hover { color: var(--text); }
    body:not(.dark) .icon-moon { display: none; }
    body.dark .icon-sun { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">
    <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
      <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="wrap">
    <div class="logo-row">
      <div class="logo-icon">
        <img src="/images/Logo.png" alt="GR" onerror="this.parentElement.innerHTML='<span style=\'font-weight:700;font-size:13px\'>GR</span>'" />
      </div>
      <span class="logo-name">GR Budget Manager</span>
    </div>

    <h1 class="heading">Welcome Back</h1>
    <p class="subheading">Enter your credentials to access your account.</p>

    <form id="form">
      <div class="field">
        <label for="u">Username</label>
        <input id="u" type="text" placeholder="Enter your username" autocomplete="username" required />
      </div>

      <div class="field">
        <label for="p">Password</label>
        <input id="p" type="password" placeholder="••••••••••••••" autocomplete="current-password" required />
      </div>

      <button class="btn-submit" id="btn" type="submit">Sign in</button>
      <div id="err"></div>
    </form>

    <p class="footer">Glori Creativity Sole Co., Ltd</p>
  </div>

  <script>
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (saved === 'dark' || (!saved && prefersDark)) document.body.classList.add('dark');

    document.getElementById('themeBtn').addEventListener('click', () => {
      const dark = document.body.classList.toggle('dark');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    });

    const form = document.getElementById('form');
    const u    = document.getElementById('u');
    const p    = document.getElementById('p');
    const err  = document.getElementById('err');
    const btn  = document.getElementById('btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res  = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u.value.trim(), password: p.value })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          err.textContent = data.message || 'Wrong username or password';
          btn.disabled = false;
          btn.textContent = 'Sign in';
          return;
        }
        location.href = '/';
      } catch {
        err.textContent = 'Cannot connect to server';
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
